name: "Manual Release"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (simulate release without pushing changes or publishing to NPM)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Run checks
        run: |
          npx tsc --noEmit
          npm test
          npm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: 'npm version ${{ inputs.release_type }} --force -m "chore(release): %s"'

      - name: Synchronize and push changes
        if: ${{ !inputs.dry_run }}
        run: |
          for i in {1..3}; do
            git pull origin main --rebase && git push origin main --follow-tags && break || sleep 2
          done

      - name: Publish to NPM
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run mode enabled: executing npm publish --dry-run"
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create v$VERSION --title "v$VERSION" --notes "Release v$VERSION"
